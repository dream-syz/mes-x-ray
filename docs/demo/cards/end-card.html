<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>MES X-Ray — 片尾字卡</title>
<!--
  End card of the 2-minute cut (docs/demo/video-kit.md §6). Palette, fonts and dot grid follow the UI. Fixed 1920×1080; render with
    cd src/MesXray.Web && npx playwright screenshot --viewport-size=1920,1080 ../../docs/demo/cards/end-card.html ../../docs/demo/cards/end-card.png
-->
<style>
  :root {
    --bg: #0a0d12;
    --ink: #e7eaf0;
    --ink-2: #b9c1ce;
    --accent: #3fc1e8;
    --sans: "Geist Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Geist Mono Variable", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--bg); }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    color: var(--ink);
    font-family: var(--sans);
    background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 12px 12px;
  }
  .center {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 50%;
    transform: translateY(-50%);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 22px;
    font-size: 72px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand .mark {
    width: 72px;
    height: 72px;
    border: 1px solid rgba(63, 193, 232, 0.6);
    border-radius: 14px;
    display: grid;
    place-items: center;
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 36px;
    box-shadow: 0 0 40px -8px rgba(63, 193, 232, 0.5);
  }
  .line {
    margin-top: 36px;
    font-size: 30px;
    color: var(--ink-2);
    letter-spacing: 0.01em;
  }
  .line b {
    color: var(--ink);
    font-weight: 600;
  }
  .line .dot {
    color: var(--accent);
    margin: 0 14px;
  }
  .repo {
    margin-top: 56px;
    font-family: var(--mono);
    font-size: 22px;
    color: var(--ink-2);
    opacity: 0.8;
  }
  .foot {
    position: absolute;
    left: 96px;
    bottom: 84px;
    font-family: var(--mono);
    font-size: 17px;
    color: var(--ink-2);
    opacity: 0.7;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="center">
    <div class="brand"><span class="mark">X</span>MES X-Ray</div>
    <div class="line"><b>扫描器</b>造证据<span class="dot">·</span><b>运行时</b>绑取值<span class="dot">·</span><b>AI</b> 只许引用证据</div>
    <div class="repo">github.com/dream-syz/mes-x-ray · docs/demo/</div>
  </div>
  <div class="foot">只读 · 白名单工具 · 不执行 SQL · 不改参数和业务数据</div>
</body>
</html>
