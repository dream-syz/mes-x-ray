<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>MES X-Ray — 对照卡：解释 vs 调查</title>
<!--
  Comparison card of the 2-minute cut (h3-brief.md clip C9): the same field asked two ways. Palette and fonts follow the UI;
  the verdict colours are the UI's Known (accent) and Need More Evidence (warn). Fixed 1920×1080; render with
    cd src/MesXray.Web && npx playwright screenshot --viewport-size=1920,1080 ../../docs/demo/cards/compare-card.html ../../docs/demo/cards/compare-card.png
-->
<style>
  :root {
    --bg: #0a0d12;
    --surface: #0f131a;
    --line: rgba(255, 255, 255, 0.1);
    --ink: #e7eaf0;
    --ink-2: #b9c1ce;
    --accent: #3fc1e8;
    --warn: #f2b545;
    --sans: "Geist Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Geist Mono Variable", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--bg); }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    color: var(--ink);
    font-family: var(--sans);
    background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 12px 12px;
  }
  .field {
    position: absolute;
    left: 0;
    right: 0;
    top: 96px;
    text-align: center;
    font-family: var(--mono);
    font-size: 22px;
    color: var(--ink-2);
  }
  .field b { color: var(--ink); font-weight: 600; }
  .panes {
    position: absolute;
    left: 120px;
    right: 120px;
    top: 220px;
    bottom: 200px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
  }
  .pane {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 56px 64px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .ask {
    font-family: var(--mono);
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .ask b { color: var(--ink); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 30px; margin-left: 12px; }
  .verdict {
    margin-top: 40px;
    font-size: 84px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .known .verdict { color: var(--accent); text-shadow: 0 0 48px rgba(63, 193, 232, 0.35); }
  .partial .verdict { color: var(--warn); text-shadow: 0 0 48px rgba(242, 181, 69, 0.3); }
  .meta {
    margin-top: 36px;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--ink-2);
  }
  .meta b { color: var(--ink); font-weight: 600; font-size: 34px; }
  .why {
    margin-top: 44px;
    font-size: 28px;
    line-height: 1.5;
    color: var(--ink-2);
  }
  .foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100px;
    text-align: center;
    font-size: 34px;
    font-weight: 600;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="field">同一个字段 <b>json:pickOrderRows.availableQuantity</b> · 同一次 trace</div>
  <div class="panes">
    <div class="pane known">
      <div class="ask">Explain<b>解释</b></div>
      <div class="verdict">已知</div>
      <div class="meta"><b>90%</b> 置信度</div>
      <div class="why">静态血缘每一跳都有代码或 SQL 证据。</div>
    </div>
    <div class="pane partial">
      <div class="ask">Investigate<b>调查</b></div>
      <div class="verdict">需要更多证据</div>
      <div class="meta"><b>80%</b> 置信度 · <b>21</b> 事实 · <b>1</b> 假设</div>
      <div class="why">「为什么是 0」依赖未捕获的行数据，只能给假设。</div>
    </div>
  </div>
  <div class="foot">证据说到哪里，结论就到哪里。</div>
</body>
</html>
