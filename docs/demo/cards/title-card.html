<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>MES X-Ray — 片头字卡</title>
<!--
  Title card of the 2-minute cut (docs/demo/video-kit.md §6). Same palette and font stack as the UI (src/MesXray.Web/src/styles.css),
  same dot grid as the graph canvas, so the cut from the card into the app is seamless. Fixed 1920×1080: open in a browser at that
  size and screenshot, or render it with
    cd src/MesXray.Web && npx playwright screenshot --viewport-size=1920,1080 ../../docs/demo/cards/title-card.html ../../docs/demo/cards/title-card.png
-->
<style>
  :root {
    --bg: #0a0d12;
    --ink: #e7eaf0;
    --ink-2: #b9c1ce;
    --accent: #3fc1e8;
    --sans: "Geist Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Geist Mono Variable", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--bg); }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    color: var(--ink);
    font-family: var(--sans);
    background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 12px 12px;
  }
  .brand {
    position: absolute;
    left: 96px;
    top: 80px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--ink-2);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .brand .mark {
    width: 40px;
    height: 40px;
    border: 1px solid rgba(63, 193, 232, 0.6);
    border-radius: 8px;
    display: grid;
    place-items: center;
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 20px;
  }
  .brand .sub {
    font-family: var(--mono);
    font-weight: 400;
    font-size: 15px;
    opacity: 0.75;
    margin-left: 6px;
  }
  .headline {
    position: absolute;
    left: 96px;
    right: 96px;
    top: 50%;
    transform: translateY(-58%);
    font-size: 96px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .headline .zero {
    color: var(--accent);
    font-family: var(--mono);
    font-weight: 600;
    text-shadow: 0 0 48px rgba(63, 193, 232, 0.45);
  }
  .foot {
    position: absolute;
    left: 96px;
    bottom: 84px;
    font-family: var(--mono);
    font-size: 17px;
    color: var(--ink-2);
    opacity: 0.7;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="brand"><span class="mark">X</span>MES X-Ray<span class="sub">Web Visual Picking · Pick Order Details</span></div>
  <div class="headline">页面上只是一个 <span class="zero">0</span>。</div>
  <div class="foot">PICK0843858 · T12288 · availableQuantity</div>
</body>
</html>
