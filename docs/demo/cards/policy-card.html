<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>MES X-Ray — 收束卡：只读边界</title>
<!--
  Closing card of the 2-minute cut (h3-brief.md clip C10): the sentence the status bar carries all the time. Fixed 1920×1080; render with
    cd src/MesXray.Web && npx playwright screenshot --viewport-size=1920,1080 ../../docs/demo/cards/policy-card.html ../../docs/demo/cards/policy-card.png
-->
<style>
  :root {
    --bg: #0a0d12;
    --surface: #0f131a;
    --line: rgba(255, 255, 255, 0.1);
    --ink: #e7eaf0;
    --ink-2: #b9c1ce;
    --accent: #3fc1e8;
    --sans: "Geist Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Geist Mono Variable", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--bg); }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    color: var(--ink);
    font-family: var(--sans);
    background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: 12px 12px;
  }
  .headline {
    position: absolute;
    left: 120px;
    right: 120px;
    top: 44%;
    transform: translateY(-50%);
    font-size: 76px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .headline .accent { color: var(--accent); }
  .statusbar {
    position: absolute;
    left: 120px;
    right: 120px;
    bottom: 200px;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 26px 34px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--ink-2);
  }
  .statusbar .tag {
    color: var(--accent);
    border: 1px solid rgba(63, 193, 232, 0.5);
    border-radius: 999px;
    padding: 4px 16px;
    font-size: 20px;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .metrics {
    position: absolute;
    left: 120px;
    bottom: 120px;
    font-family: var(--mono);
    font-size: 20px;
    color: var(--ink-2);
    opacity: 0.75;
  }
  .metrics b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="headline">证据说到哪里，<br /><span class="accent">结论</span>就到哪里。</div>
  <div class="statusbar"><span class="tag">只读</span>仅白名单运行时工具，不执行 SQL，不修改参数或业务数据。</div>
  <div class="metrics"><b>210</b> 节点 · <b>363</b> 边 · <b>113</b> 血缘 · <b>2</b> 未知 · <b>4</b> 待补充 · <b>2</b> 已知缺口 — 缺口公开在状态栏</div>
</body>
</html>
