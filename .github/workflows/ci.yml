name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Action majors are the Node 24 runtime generation (GitHub removes Node 20 from hosted runners on 2026-09-16).
jobs:
  dotnet:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MesXray.slnx

      - name: Build (warnings are errors)
        run: dotnet build MesXray.slnx --no-restore --configuration Release

      # Scanner unit tests + graph integration tests (design §17), plus runtime/AI and API acceptance tests.
      - name: Test
        run: dotnet test MesXray.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results
          path: artifacts/test-results

  web:
    name: Type-check & build (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MesXray.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MesXray.Web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build

  e2e:
    name: Demo scenes (Playwright, API + UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MesXray.Web/package-lock.json

      - name: Build API
        run: dotnet build src/MesXray.Api --configuration Release

      - name: Install web packages and Chromium
        working-directory: src/MesXray.Web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # playwright.config.ts starts the API (offline, fixtures only) and the Vite dev server itself.
      - name: Run the seven demo scenes in both languages
        working-directory: src/MesXray.Web
        run: npm run e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: artifacts/e2e

  secrets-scan:
    name: Secret scan (fixtures & docs must stay sanitized)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
